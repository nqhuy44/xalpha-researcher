[tool.poetry]
name = "xalpha-researcher"
version = "0.1.0"
description = "Personalized AI Agent System for Vietnamese Stock Market Analysis"
authors = ["nqhuy"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"

# Core
pydantic = "^2.0"
pydantic-settings = "^2.0"
structlog = "^24.0"
httpx = "^0.28"

# Data
vnstock = "^3.0"
pandas = "^2.0"
numpy = "^2.0"
feedparser = "^6.0"
apscheduler = "^3.10"
trafilatura = "^2.0.0"

# Database
asyncpg = "^0.30"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.14"
pgvector = "^0.3"
redis = "^5.0"

# LLM & AI
google-genai = "^1.0"
langchain = "^0.3"
langgraph = "^0.3"

# NLP / ML
transformers = "^4.40"
torch = {version = "^2.0", source = "pytorch"}
xgboost = "^2.0"
scikit-learn = "^1.5"
shap = "^0.46"

# API & Bot
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
python-telegram-bot = "^21.0"
python-jose = {extras = ["cryptography"], version = "^3.3"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
ruff = "^0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
