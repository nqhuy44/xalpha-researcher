services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xalpha-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES__PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES__DB:-xalpha}
      POSTGRES_USER: ${POSTGRES__USER:-xalpha}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-xalpha_dev}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-xalpha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: xalpha-redis
    restart: unless-stopped
    ports:
      - "${REDIS__PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS__PASSWORD:-xalpha_dev}
    volumes:
      - ./redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD:-xalpha_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

